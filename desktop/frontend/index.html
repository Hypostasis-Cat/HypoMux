<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/support/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>HypoMux</title>
    <script>
      // Set initial appearance mode before any rendering to prevent flash of unstyled content
      (function() {
        const systemMode = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.appearance = systemMode;
        document.documentElement.dataset.material = 'solid';
        document.documentElement.dataset.panelMaterial = 'blur';
        document.documentElement.dataset.backgroundSource = 'system';
      })();
    </script>
  </head>
  <body>
    <style>
      html, body { margin: 0; background: #f3f3f3; }
      html[data-appearance="dark"], html[data-appearance="dark"] body { background: #202020; }
      .boot-placeholder { height: 100vh; display: grid; place-content: center; gap: 8px; text-align: center; font: 14px system-ui, sans-serif; color: #656565; }
      html[data-appearance="dark"] .boot-placeholder { color: #b8b8b8; }
    </style>
    <div id="root"><div class="boot-placeholder" role="status"><strong>HypoMux</strong><span>正在启动…</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
