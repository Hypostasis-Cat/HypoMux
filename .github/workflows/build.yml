name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: SignPath policy used for the executable, Core, and installer
        required: true
        type: choice
        options: [none, test, production]
        default: none
      publish_release:
        description: Publish the production-signed installer to the selected v* tag
        required: true
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0-alpha2.119
  INSTALLER_PATH: desktop/bin/HypoMux-amd64-installer.exe

jobs:
  build:
    name: Validate and package Wails desktop
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release options
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ inputs.signing_mode }}" -eq "production" -and
              "${{ github.ref }}" -ne "refs/heads/main" -and
              "${{ github.ref }}" -notlike "refs/tags/v*") {
            throw "Production signing is limited to main or a v* tag."
          }
          if ("${{ inputs.publish_release }}" -eq "true" -and
              ("${{ inputs.signing_mode }}" -ne "production" -or
               "${{ github.ref }}" -notlike "refs/tags/v*")) {
            throw "Publishing requires production signing from a v* tag."
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}"
          choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir desktop/frontend install --frozen-lockfile

      - name: Build frontend assets for Go validation
        shell: pwsh
        run: pnpm --dir desktop/frontend build

      - name: Validate Go modules
        shell: pwsh
        run: |
          go -C engine mod verify
          go -C desktop mod verify
          go -C engine test ./...
          go -C desktop test ./...
          go -C engine vet ./...
          go -C desktop vet ./...

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = @(
            go -C engine fmt ./...
            go -C desktop fmt ./...
          )
          if ($files.Count -gt 0) {
            $files | ForEach-Object { Write-Error "gofmt changed: $_" }
            exit 1
          }
          if (-not (git diff --quiet -- engine desktop)) {
            throw "Go sources are not formatted."
          }

      - name: Build and package Wails desktop
        working-directory: desktop
        shell: pwsh
        run: wails3 task windows:package

      - name: Upload desktop executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-desktop
        uses: actions/upload-artifact@v7
        with:
          path: desktop/bin/hypomux.exe
          archive: false
          if-no-files-found: error

      - name: Sign desktop executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'production' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-desktop.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-desktop
          skip-decompress: true

      - name: Upload Core executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-core
        uses: actions/upload-artifact@v7
        with:
          path: desktop/bin/hypomux-engine.exe
          archive: false
          if-no-files-found: error

      - name: Sign Core executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'production' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-core
          skip-decompress: true

      - name: Repackage signed executables
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: |
          Copy-Item signed-desktop\hypomux.exe desktop\bin\hypomux.exe -Force
          Copy-Item signed-core\hypomux-engine.exe desktop\bin\hypomux-engine.exe -Force
          Push-Location desktop\build\windows\nsis
          makensis "-DARG_WAILS_AMD64_BINARY=..\..\..\bin\hypomux.exe" project.nsi
          Pop-Location

      - name: Upload installer for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.INSTALLER_PATH }}
          archive: false
          if-no-files-found: error

      - name: Sign installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'production' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Use signed installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: Copy-Item signed-installer\HypoMux-amd64-installer.exe "${{ env.INSTALLER_PATH }}" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: HypoMux-Windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            desktop/bin/hypomux.exe
            desktop/bin/hypomux-engine.exe
            ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

  release:
    name: Publish release installer
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.signing_mode == 'production' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: HypoMux-Windows-${{ github.ref_name }}-${{ github.sha }}
          path: artifacts

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/HypoMux-amd64-installer.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
