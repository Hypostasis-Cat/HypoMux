name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signing_mode:
        description: Build/signing mode (publish requires selecting a v* tag)
        required: true
        type: choice
        options: [none, test, production, publish]
        default: none

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  WAILS_VERSION: v3.0.0-alpha2.119
  INSTALLER_PATH: desktop/bin/hypomux-amd64-installer.exe

jobs:
  build:
    name: Validate and package Wails desktop
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release options
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ inputs.signing_mode }}" -eq "production" -and
              "${{ github.ref }}" -ne "refs/heads/main") {
            throw "Production-signing tests must be started from main."
          }
          if ("${{ inputs.signing_mode }}" -eq "publish" -and
              "${{ github.ref }}" -notlike "refs/tags/v*") {
            throw "Publishing must be started from a v* tag."
          }
          if ("${{ inputs.signing_mode }}" -eq "test" -and
              "${{ github.ref }}" -like "refs/tags/*") {
            throw "Test signing must not be started from a release tag."
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            desktop/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/frontend/pnpm-lock.yaml

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${env:WAILS_VERSION}"
          choco install nsis --yes --no-progress

          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          $makensis = Join-Path $nsisDirectory 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "NSIS compiler was not found at $makensis."
          }
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "makensis version check failed with exit code $LASTEXITCODE."
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nsisDirectory -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MAKENSIS=$makensis" -Encoding utf8

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir desktop/frontend install --frozen-lockfile

      - name: Generate Wails frontend bindings
        working-directory: desktop
        shell: pwsh
        run: wails3 generate bindings -clean=true -ts -i

      - name: Run frontend tests
        shell: pwsh
        run: pnpm --dir desktop/frontend test

      - name: Build frontend assets for Go validation
        shell: pwsh
        run: pnpm --dir desktop/frontend build

      - name: Validate Go modules
        shell: pwsh
        run: |
          go -C engine mod verify
          go -C desktop mod verify
          go -C engine test ./...
          go -C desktop test ./...
          go -C engine vet ./...
          go -C desktop vet ./...

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $goFiles = @(
            git ls-files -- '*.go' |
              Where-Object { $_ -like 'engine/*' -or $_ -like 'desktop/*' }
          )
          if ($goFiles.Count -eq 0) {
            throw "No tracked Go source files were found."
          }

          $unformatted = @(gofmt -l @goFiles)
          if ($LASTEXITCODE -ne 0) {
            throw "gofmt failed with exit code $LASTEXITCODE."
          }
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "Not gofmt-formatted: $_" }
            exit 1
          }

      - name: Build and package Wails desktop
        working-directory: desktop
        shell: pwsh
        run: wails3 task windows:package

      - name: Stage unsigned executables for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input | Out-Null
          Copy-Item desktop\bin\hypomux.exe signing-input\hypomux-unsigned.exe -Force
          Copy-Item desktop\bin\hypomux-engine.exe signing-input\hypomux-engine-unsigned.exe -Force

      - name: Upload desktop executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-desktop
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/hypomux-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign desktop executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-desktop.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-desktop
          skip-decompress: true

      - name: Upload Core executable for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-core
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/hypomux-engine-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign Core executable
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-core
          skip-decompress: true

      - name: Repackage signed executables
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: |
          Copy-Item signed-desktop\hypomux-unsigned.exe desktop\bin\hypomux.exe -Force
          Copy-Item signed-core\hypomux-engine-unsigned.exe desktop\bin\hypomux-engine.exe -Force
          Push-Location desktop\build\windows\nsis
          & $env:MAKENSIS "-DARG_WAILS_AMD64_BINARY=..\..\..\bin\hypomux.exe" project.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "Signed installer repackaging failed with exit code $LASTEXITCODE."
          }
          Pop-Location

      - name: Stage unsigned installer for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: Copy-Item "${{ env.INSTALLER_PATH }}" signing-input\HypoMux-amd64-installer-unsigned.exe -Force

      - name: Upload installer for SignPath
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          path: signing-input/HypoMux-amd64-installer-unsigned.exe
          archive: false
          if-no-files-found: error

      - name: Sign installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 4463263d-e740-4262-ae16-7eac788453ea
          project-slug: HypoMux
          signing-policy-slug: ${{ inputs.signing_mode == 'test' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Use signed installer
        if: github.event_name == 'workflow_dispatch' && inputs.signing_mode != 'none'
        shell: pwsh
        run: Copy-Item signed-installer\HypoMux-amd64-installer-unsigned.exe "${{ env.INSTALLER_PATH }}" -Force

      - name: Verify production installer trust policy
        if: github.event_name == 'workflow_dispatch' && (inputs.signing_mode == 'production' || inputs.signing_mode == 'publish')
        shell: pwsh
        run: |
          $env:HYPOMUX_SIGNED_INSTALLER_TEST = (Resolve-Path "${{ env.INSTALLER_PATH }}").Path
          go -C desktop test ./internal/services -run TestVerifyDownloadedInstallerAuthenticityAcceptsOfficialSignedInstaller -count=1 -v

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HypoMux-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            desktop/bin/hypomux.exe
            desktop/bin/hypomux-engine.exe
            ${{ env.INSTALLER_PATH }}
          if-no-files-found: error

  release:
    name: Publish release installer
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.signing_mode == 'publish' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: HypoMux-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts

      - name: Stage legacy-updater-compatible installer name
        id: stage_release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp artifacts/hypomux-amd64-installer.exe "artifacts/HypoMux_Setup_${version}.exe"
          echo "installer_name=HypoMux_Setup_${version}.exe" >> "${GITHUB_OUTPUT}"

      - name: Generate update manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer_name="HypoMux_Setup_${version}.exe"
          installer_path="artifacts/${installer_name}"
          installer_size="$(stat -c%s "${installer_path}")"
          installer_sha256="$(sha256sum "${installer_path}" | awk '{print $1}')"
          jq -n \
            --arg version "${version}" \
            --arg name "HypoMux ${version}" \
            --arg installer_name "${installer_name}" \
            --arg installer_sha256 "${installer_sha256}" \
            --arg github_url "https://github.com/Hypostasis-Cat/HypoMux/releases/download/${GITHUB_REF_NAME}/${installer_name}" \
            --arg cnb_url "https://cnb.cool/Hypostasis-Cat/HypoMux/-/releases/download/${GITHUB_REF_NAME}/${installer_name}" \
            --argjson installer_size "${installer_size}" \
            '{
              schema_version: 1,
              version: $version,
              name: $name,
              notes: "",
              installer: {
                name: $installer_name,
                size: $installer_size,
                sha256: $installer_sha256,
                urls: [$cnb_url, $github_url]
              }
            }' > artifacts/latest.json
          jq empty artifacts/latest.json

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_MANIFEST_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_ED25519_PRIVATE_KEY }}
        run: |
          go -C desktop run ./cmd/update-manifest-sign \
            -input ../artifacts/latest.json \
            -output ../artifacts/latest.json.sig \
            -verify-public-key "$(tr -d '\r\n' < desktop/internal/services/update_manifest_ed25519_public_key.txt)"
          test "$(stat -c%s artifacts/latest.json.sig)" -eq 64

      - name: Preflight synchronized GitHub and CNB tags
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          expected_commit="$(git rev-parse HEAD^{commit})"
          resolve_remote_tag_commit() {
            local repository="$1"
            local refs
            local direct
            local peeled
            refs="$(git ls-remote "${repository}" "refs/tags/${tag}" "refs/tags/${tag}^{}" || true)"
            direct="$(awk -v ref="refs/tags/${tag}" '$2 == ref {print $1; exit}' <<<"${refs}")"
            peeled="$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref {print $1; exit}' <<<"${refs}")"
            if [[ -n "${peeled}" ]]; then printf '%s' "${peeled}"; else printf '%s' "${direct}"; fi
          }
          github_commit="$(resolve_remote_tag_commit origin)"
          cnb_commit="$(resolve_remote_tag_commit https://cnb.cool/Hypostasis-Cat/HypoMux)"
          if [[ -z "${github_commit}" || -z "${cnb_commit}" ||
                "${github_commit}" != "${cnb_commit}" ||
                "${github_commit}" != "${expected_commit}" ]]; then
            echo "Release tag preflight failed: expected=${expected_commit} GitHub=${github_commit:-missing} CNB=${cnb_commit:-missing}."
            exit 1
          fi
          echo "Release tag ${tag} is synchronized at ${expected_commit}."

      - name: Ensure CNB Release and upload installer
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_IMAGE: docker.cnb.cool/looc/git-cnb@sha256:c254172bb9d6025733a0e2991b4a99af8c46aeedcadcb468788ef5a0dc00275c
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cnb() {
            docker run --rm -e CNB_TOKEN "${CNB_IMAGE}" \
              git-cnb --repo=Hypostasis-Cat/HypoMux "$@"
          }

          if ! cnb release get -t "${tag}" >/dev/null 2>&1; then
            cnb release create -t "${tag}" -n "HypoMux ${version}" --make-latest true
          fi
          cnb release get -t "${tag}" >/dev/null

          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          asset_url="https://cnb.cool/Hypostasis-Cat/HypoMux/-/releases/download/${tag}/$(basename "${installer}")"
          existing="artifacts/cnb-existing-installer.exe"
          status="$(curl --silent --show-error --location --output "${existing}" --write-out '%{http_code}' "${asset_url}" || true)"
          case "${status}" in
            200)
              if ! cmp --silent "${installer}" "${existing}"; then
                echo "CNB Release already contains a different installer with the same name."
                exit 1
              fi
              echo "CNB installer already exists and is byte-identical; skipping upload."
              ;;
            404)
              docker run --rm -e CNB_TOKEN \
                -v "${PWD}:/workspace:ro" -w /workspace "${CNB_IMAGE}" \
                git-cnb --repo=Hypostasis-Cat/HypoMux \
                  release asset-upload -t "${tag}" -f "${installer}"
              ;;
            *)
              echo "Unable to inspect the CNB installer before upload (HTTP ${status:-unknown})."
              exit 1
              ;;
          esac

      - name: Check existing GitHub installer
        id: github_installer
        shell: bash
        run: |
          set -euo pipefail
          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          asset_url="https://github.com/Hypostasis-Cat/HypoMux/releases/download/${GITHUB_REF_NAME}/$(basename "${installer}")"
          existing="artifacts/github-existing-installer.exe"
          status="$(curl --silent --show-error --location --output "${existing}" --write-out '%{http_code}' "${asset_url}" || true)"
          case "${status}" in
            200)
              if ! cmp --silent "${installer}" "${existing}"; then
                echo "GitHub Release already contains a different installer with the same name."
                exit 1
              fi
              echo "upload=false" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "upload=true" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unable to inspect the GitHub installer before upload (HTTP ${status:-unknown})."
              exit 1
              ;;
          esac

      - name: Upload installer to GitHub Release
        if: steps.github_installer.outputs.upload == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/${{ steps.stage_release.outputs.installer_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both Release installers are byte-identical
        shell: bash
        run: |
          set -euo pipefail
          installer="artifacts/${{ steps.stage_release.outputs.installer_name }}"
          filename="$(basename "${installer}")"
          verify_download() {
            local label="$1"
            local url="$2"
            local destination="$3"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --output "${destination}" "${url}" &&
                 cmp --silent "${installer}" "${destination}"; then
                echo "${label} installer matches the signed build."
                return 0
              fi
              rm -f "${destination}"
              sleep 5
            done
            echo "${label} installer did not become available or was not byte-identical."
            return 1
          }
          verify_download GitHub \
            "https://github.com/Hypostasis-Cat/HypoMux/releases/download/${GITHUB_REF_NAME}/${filename}" \
            artifacts/verify-github-installer.exe
          verify_download CNB \
            "https://cnb.cool/Hypostasis-Cat/HypoMux/-/releases/download/${GITHUB_REF_NAME}/${filename}" \
            artifacts/verify-cnb-installer.exe
          sha256sum "${installer}" artifacts/verify-github-installer.exe artifacts/verify-cnb-installer.exe

      - name: Publish signed update channel to GitHub and CNB
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          channel_ref="refs/heads/update-channel"
          credential_file="$(mktemp)"
          cleanup() {
            git config --local --unset-all credential.helper >/dev/null 2>&1 || true
            rm -f "${credential_file}"
          }
          trap cleanup EXIT
          chmod 600 "${credential_file}"
          git config --local credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=cnb.cool\nusername=cnb\npassword=%s\n\n' "${CNB_TOKEN}" |
            git credential approve
          if git remote get-url cnb >/dev/null 2>&1; then
            git remote set-url cnb https://cnb.cool/Hypostasis-Cat/HypoMux
          else
            git remote add cnb https://cnb.cool/Hypostasis-Cat/HypoMux
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent="$(git ls-remote origin "${channel_ref}" | awk 'NR == 1 {print $1}')"
          if [[ -n "${parent}" ]]; then
            git fetch --no-tags origin "${channel_ref}:refs/remotes/origin/update-channel"
          fi

          manifest_blob="$(git hash-object -w artifacts/latest.json)"
          signature_blob="$(git hash-object -w artifacts/latest.json.sig)"
          channel_tree="$(printf '100644 blob %s\tlatest.json\n100644 blob %s\tlatest.json.sig\n' \
            "${manifest_blob}" "${signature_blob}" | git mktree)"
          if [[ -n "${parent}" && "$(git rev-parse "${parent}^{tree}")" == "${channel_tree}" ]]; then
            channel_commit="${parent}"
          elif [[ -n "${parent}" ]]; then
            channel_commit="$(printf 'Update channel for %s\n' "${GITHUB_REF_NAME}" |
              git commit-tree "${channel_tree}" -p "${parent}")"
          else
            channel_commit="$(printf 'Initialize update channel for %s\n' "${GITHUB_REF_NAME}" |
              git commit-tree "${channel_tree}")"
          fi

          git push origin "${channel_commit}:${channel_ref}"
          git push cnb "${channel_commit}:${channel_ref}"
          github_channel="$(git ls-remote origin "${channel_ref}" | awk 'NR == 1 {print $1}')"
          cnb_channel="$(git ls-remote cnb "${channel_ref}" | awk 'NR == 1 {print $1}')"
          if [[ "${github_channel}" != "${channel_commit}" || "${cnb_channel}" != "${channel_commit}" ]]; then
            echo "Update channel synchronization failed: expected=${channel_commit} GitHub=${github_channel:-missing} CNB=${cnb_channel:-missing}."
            exit 1
          fi
          echo "Update channel synchronized at ${channel_commit}."

      - name: Verify both raw update channels and Ed25519 signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p channel-verify
          fetch_exact() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local destination="$4"
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --output "${destination}" "${url}" &&
                 cmp --silent "${expected}" "${destination}"; then
                echo "${label} is byte-identical."
                return 0
              fi
              rm -f "${destination}"
              sleep 5
            done
            echo "${label} did not match the published update channel."
            return 1
          }
          fetch_exact "GitHub latest.json" \
            https://raw.githubusercontent.com/Hypostasis-Cat/HypoMux/update-channel/latest.json \
            artifacts/latest.json channel-verify/github-latest.json
          fetch_exact "GitHub latest.json.sig" \
            https://raw.githubusercontent.com/Hypostasis-Cat/HypoMux/update-channel/latest.json.sig \
            artifacts/latest.json.sig channel-verify/github-latest.json.sig
          fetch_exact "CNB latest.json" \
            https://cnb.cool/Hypostasis-Cat/HypoMux/-/git/raw/update-channel/latest.json \
            artifacts/latest.json channel-verify/cnb-latest.json
          fetch_exact "CNB latest.json.sig" \
            https://cnb.cool/Hypostasis-Cat/HypoMux/-/git/raw/update-channel/latest.json.sig \
            artifacts/latest.json.sig channel-verify/cnb-latest.json.sig
          public_key="$(tr -d '\r\n' < desktop/internal/services/update_manifest_ed25519_public_key.txt)"
          go -C desktop run ./cmd/update-manifest-sign \
            -verify-only \
            -input ../channel-verify/github-latest.json \
            -output ../channel-verify/github-latest.json.sig \
            -verify-public-key "${public_key}"
          go -C desktop run ./cmd/update-manifest-sign \
            -verify-only \
            -input ../channel-verify/cnb-latest.json \
            -output ../channel-verify/cnb-latest.json.sig \
            -verify-public-key "${public_key}"
